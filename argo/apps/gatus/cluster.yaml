apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-postgresql
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:2a2fe731f3b421d1a1c1f84e70e95ef0658bf198b6c8dbbfe53d51f24c3275b8
  instances: 2
  enablePDB: true
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  switchoverDelay: 120
  # Prefer spreading instances across nodes, but allow co-location on 2-node cluster.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: gatus-postgres-user
  storage:
    storageClass: local-path
    size: 15Gi
