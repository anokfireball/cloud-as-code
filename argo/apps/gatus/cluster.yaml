apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-postgresql
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:48478b54981de2a4f38d20ed1ef85fc9b3e1f3920aa16ed37ca6d2e78b6defd1
  instances: 2
  enablePDB: true
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  switchoverDelay: 120
  # Prefer spreading instances across nodes, but allow co-location on 2-node cluster.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: gatus-postgres-user
  storage:
    storageClass: local-path
    size: 15Gi
